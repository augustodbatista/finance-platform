name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      flutter: ${{ steps.filter.outputs.flutter }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            go:
              - 'api/**'
            flutter:
              - 'app/**'

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
      - name: Formatacao
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Lint + gosec
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: api
      - name: Testes
        run: go test -race -cover ./...
      - name: Vulnerabilidades alcancaveis
        uses: golang/govulncheck-action@v1
        with:
          work-dir: api

  flutter:
    needs: changes
    if: needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test --coverage

  # deps-audit e sast rodam sempre, sem paths-filter: uma CVE nova aparece
  # sem que ninguem tenha tocado no codigo.
  deps-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Versao exata de proposito: este repo NAO publica tag flutuante de major
      # (nao existe `v2`), so releases completas. Trocar por `@v2` quebra o job.
      - uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        with:
          scan-args: |-
            --recursive
            ./

  sast:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7
      # p/dart e p/flutter nao existem no registry do semgrep (HTTP 404); a
      # analise estatica do Dart fica a cargo do `flutter analyze` no job flutter.
      - run: |
          semgrep scan --error --skip-unknown-extensions \
            --config p/golang \
            --config p/secrets
